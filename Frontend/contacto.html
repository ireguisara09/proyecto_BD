

<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Tienda — Contacto</title>

  <!-- Fuente moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap";
    rel="stylesheet" />

  <link rel="stylesheet" href="contacto.css" />
</head>

<body>
  <!-- ===== BARRA DE NAVEGACIÓN (NAVBAR) ===== -->
  <header class="navbar">
    <div class="contenedor nav-contenido">
      <a href="index.html" class="logo"> Mi<strong>Tienda</strong></a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="index.html">Productos</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <main class="contenedor" id="inicio">
    <div class="encabezado-principal">
      <h1>Sistema de Gestión de Productos</h1>
      <p>¿Tienes dudas o sugerencias? Dejanos un mensaje </p>
    </div>

    <div class="panel-tienda">
      <!-- SECCIÓN 1: Formulario de Registro -->
      <section class="tarjeta" id="registro">
        <h2 id="tituloFormulario">Envíanos un mensaje</h2>

        <form id="formularioMensaje">
          <!-- Campo oculto para almacenar el ID en caso de edición -->
          <input type="hidden" id="mensajeId" value="" />
          <section class="form-ajuste">
          <div class="campo">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" placeholder="Ej: Carlos Rojas" required />
          </div>

          <div class="campo">
            <label for="correo">Correo electrónico:</label>
            <input type="text" id="email" step="0.01" placeholder="Ej: carlosrojas@gamil.com" required />
          </div>
        </section>

          <div class="campo-ajuste">
            <label for="Asunto">Asunto:</label>
            <input type="text" id="asunto" placeholder="Ej: Cambio de producto" required />
          </div>

          <div class="campo-ajuste">
            <label for="stock">Mensaje:</label>
            <input type="text" id="mensaje" placeholder="Ej: Cambio de producto" required />
          </div>
           
          <div class="acciones-form">
            <button type="submit" id="btnGuardar" class="btn btn-guardar">Enviar mensaje</button>
            <button type="button" id="btnCancelar" class="btn btn-cancelar" style="display: none;">Cancelar</button>
          </div>
        </form>
      </section>

    <!-- SECCIÓN 2: Lista de Productos -->
      <section class="tarjeta" id="mensajes">
        <h2>Lista de Mensajes</h2>
        <div id="listaMensajes" class="lista-mensajes">
          <!-- Los productos se cargan desde app.js -->
        </div>
      </section>

    </div>
  </main>



  <!-- ===== PIE DE PÁGINA (FOOTER) ===== -->
  <footer class="footer">
    <div class="contenedor footer-contenido">
      <p>&copy 2026 Mi Tienda — Proyecto Formativo con Node.js, Express y MySQL.</p>
    </div>
  </footer>

  <script src="contacto.js"></script>
</body>

</html>
